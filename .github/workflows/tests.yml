name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: dedalus3
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          miniforge-version: latest

      - name: Disable threading
        shell: bash -el {0}
        run: |
          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "NUMEXPR_MAX_THREADS=1" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "BLIS_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "VECLIB_MAXIMUM_THREADS=1" >> "$GITHUB_ENV"
          echo "NUMEXPR_NUM_THREADS=1" >> "$GITHUB_ENV"

      - name: Install Dedalus
        shell: bash -el {0}
        run: |
          conda install -c conda-forge dedalus

      - name: Install gains
        shell: bash -el {0}
        run: |
          python -m pip install -e ".[test]"

      - name: Run tests
        shell: bash -el {0}
        run: |
          pytest
